[package]
name = "lexprocedura"
version = "2.2.0"
description = "Deadline Breaker - French civil procedure deadlines and matters (local-first)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5.0"
regex = "1"
pdf-extract = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

# Windows : coffre-fort des clés (Gestionnaire d'identification) et lancement automatique (registre).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"

# macOS : coffre-fort des clés dans le Trousseau (lancement automatique : agent LaunchAgents).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
